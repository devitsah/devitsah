<svg xmlns="http://www.w3.org/2000/svg" width="336" height="221" viewBox="0 0 336 221" role="img" aria-label="langs-frame.svg">
<defs>
<linearGradient id="bgu2" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#2563EB"><animate attributeName="stop-color" values="#2563EB;#0891B2;#10B981;#2563EB" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="0.5" stop-color="#0891B2"><animate attributeName="stop-color" values="#0891B2;#10B981;#2563EB;#0891B2" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="1" stop-color="#10B981"><animate attributeName="stop-color" values="#10B981;#2563EB;#0891B2;#10B981" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<clipPath id="clipu2"><rect x="10" y="10" width="316" height="201" rx="12"/></clipPath>
</defs>
<rect x="1" y="1" width="334" height="219" rx="23" fill="#FFFFFF"/>
<g clip-path="url(#clipu2)">
  <svg x="10" y="10" width="316" height="201" viewBox="0 0 300 165" preserveAspectRatio="xMidYMid meet">
    
        <title id="titleId"></title>
        <desc id="descId"></desc>
        <style>
          .header {
            font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
            fill: #2563EB;
            animation: fadeInAnimation 0.8s ease-in-out forwards;
          }
          @supports(-moz-appearance: auto) {
            /* Selector detects Firefox */
            .header { font-size: 15.5px; }
          }
          
    @keyframes slideInAnimation {
      from {
        width: 0;
      }
      to {
        width: calc(100%-100px);
      }
    }
    @keyframes growWidthAnimation {
      from {
        width: 0;
      }
      to {
        width: 100%;
      }
    }
    .stat {
      font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif; fill: #475569;
    }
    @supports(-moz-appearance: auto) {
      /* Selector detects Firefox */
      .stat { font-size:12px; }
    }
    .bold { font-weight: 700 }
    .lang-name {
      font: 400 11px "Segoe UI", Ubuntu, Sans-Serif;
      fill: #475569;
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    #rect-mask rect{
      animation: slideInAnimation 1s ease-in-out forwards;
    }
    .lang-progress{
      animation: growWidthAnimation 0.6s ease-in-out forwards;
    }
    

          
      /* Animations */
      @keyframes scaleInAnimation {
        from {
          transform: translate(-5px, 5px) scale(0);
        }
        to {
          transform: translate(-5px, 5px) scale(1);
        }
      }
      @keyframes fadeInAnimation {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    
          
        </style>

        

        <rect
          data-testid="card-bg"
          x="0.5"
          y="0.5"
          rx="4.5"
          height="99%"
          stroke="#e4e2e2"
          width="299"
          fill="#FFFFFF"
          stroke-opacity="0"
        />

        
      <g
        data-testid="card-title"
        transform="translate(25, 35)"
      >
        <g transform="translate(0, 0)">
      <text
        x="0"
        y="0"
        class="header"
        data-testid="header"
      >Most Used Languages</text>
    </g>
      </g>
    

        <g
          data-testid="main-card-body"
          transform="translate(0, 55)"
        >
          
    <svg data-testid="lang-items" x="25">
      
  
      <mask id="rect-mask">
          <rect x="0" y="0" width="250" height="8" fill="white" rx="5"/>
        </mask>
        
        <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="0"
          y="0"
          width="188.55"
          height="8"
          fill="#3572A5"
        />
      
        <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="188.55"
          y="0"
          width="18.45"
          height="8"
          fill="#336790"
        />
      
        <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="207"
          y="0"
          width="18.35"
          height="8"
          fill="#DA5B0B"
        />
      
        <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="225.35"
          y="0"
          width="16.62"
          height="8"
          fill="#555555"
        />
      
        <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="241.97"
          y="0"
          width="14.57"
          height="8"
          fill="#e4cc98"
        />
      
        <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="246.54"
          y="0"
          width="13.45"
          height="8"
          fill="#fedf5b"
        />
      
      
    <g transform="translate(0, 25)">
      <g transform="translate(0, 0)"><g transform="translate(0, 0)">
    <g class="stagger" style="animation-delay: 450ms">
      <circle cx="5" cy="6" r="5" fill="#3572A5" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        Python 75.42%
      </text>
    </g>
  </g><g transform="translate(0, 25)">
    <g class="stagger" style="animation-delay: 600ms">
      <circle cx="5" cy="6" r="5" fill="#336790" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        PLpgSQL 7.38%
      </text>
    </g>
  </g><g transform="translate(0, 50)">
    <g class="stagger" style="animation-delay: 750ms">
      <circle cx="5" cy="6" r="5" fill="#DA5B0B" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        Jupyter Notebook 7.34%
      </text>
    </g>
  </g></g><g transform="translate(150, 0)"><g transform="translate(0, 0)">
    <g class="stagger" style="animation-delay: 450ms">
      <circle cx="5" cy="6" r="5" fill="#555555" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        C 6.65%
      </text>
    </g>
  </g><g transform="translate(0, 25)">
    <g class="stagger" style="animation-delay: 600ms">
      <circle cx="5" cy="6" r="5" fill="#e4cc98" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        Tcl 1.83%
      </text>
    </g>
  </g><g transform="translate(0, 50)">
    <g class="stagger" style="animation-delay: 750ms">
      <circle cx="5" cy="6" r="5" fill="#fedf5b" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        Cython 1.38%
      </text>
    </g>
  </g></g>
    </g>
  
    </svg>
  
        </g>
      
  </svg>
</g>
<rect x="3" y="3" width="330" height="215" rx="21" fill="none" stroke="url(#bgu2)" stroke-width="3" stroke-linecap="round" stroke-dasharray="18 10">
  <animate attributeName="stroke-dashoffset" values="0;-56" dur="3.5s" repeatCount="indefinite"/>
</rect>
</svg>
