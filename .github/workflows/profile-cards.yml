name: Build GitHub Stats / Snake Frames

on:
  schedule:
    - cron: "30 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=githublight&color_snake=7C3AED&color_dots=#eef2ff,#c7d2fe,#93c5fd,#38bdf8,#0891B2
            dist/github-snake-dark.svg?palette=githubdark&color_snake=22D3EE&color_dots=#2d3343,#4c1d95,#7C3AED,#A78BFA,#22D3EE

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build self-contained frame SVGs
        run: python3 generator/build_stats_frames.py

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          fqdn: false
          jekyll: false
          commit_message: "Update stats/snake frames [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
